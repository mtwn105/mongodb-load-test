name: mongodb-loadtest-ycsb
services:
  mongo:
    image: mongo@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
    cpus: 2
    mem_limit: 2g
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  mongo-data:
